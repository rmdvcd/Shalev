<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Mapa de navegación y acciones de Shalev</title>
  <desc id="descripcion">Cuatro destinos en la barra inferior. Ajustes se abre desde Inicio. Las acciones usan iconos accesibles.</desc>
  <rect width="880" height="460" rx="18" fill="#F5F7FA" stroke="#CFD7E3" stroke-width="1.5"/>
  <path d="M18 0h844a18 18 0 0 1 18 18v44H0V18A18 18 0 0 1 18 0Z" fill="#2B4FA3"/>
  <text x="26" y="29" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Mapa de navegación y acciones de Shalev</text>
  <text x="26" y="49" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#DCE6FF">Cuatro destinos en la barra inferior · Ajustes se abre desde Inicio</text>

  <text x="440" y="91" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B4FA3" text-anchor="middle">BARRA INFERIOR · Toca un destino o desliza hacia los lados</text>

  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="31" y="108" width="190" height="132" rx="14" fill="#F2F6FF" stroke="#2B4FA3" stroke-width="2.4"/>
    <circle cx="126" cy="144" r="22" fill="#2B4FA3"/>
    <path d="M114 144l12-10 12 10v12h-8v-8h-8v8h-8z" fill="#FFFFFF"/>
    <text x="126" y="183" font-size="14" font-weight="bold" fill="#1A1C1E">Inicio</text>
    <text x="126" y="204" font-size="11" fill="#5F6368">Turno, alertas y ventas</text>
    <text x="126" y="220" font-size="11" fill="#5F6368">Ajustes: engranaje arriba</text>

    <rect x="239" y="108" width="190" height="132" rx="14" fill="#FFFFFF" stroke="#CFD7E3" stroke-width="1.5"/>
    <circle cx="334" cy="144" r="22" fill="#E6EDFA"/>
    <path d="M323 133h22v6h-22zm2 8h18v15h-18zm5 3v3h3v-3zm6 0v3h3v-3z" fill="#2B4FA3"/>
    <text x="334" y="183" font-size="14" font-weight="bold" fill="#1A1C1E">Inventario</text>
    <text x="334" y="204" font-size="11" fill="#5F6368">Artículos, insumos,</text>
    <text x="334" y="220" font-size="11" fill="#5F6368">recetas y exportación</text>

    <rect x="447" y="108" width="190" height="132" rx="14" fill="#FFFFFF" stroke="#CFD7E3" stroke-width="1.5"/>
    <circle cx="542" cy="144" r="22" fill="#E6EDFA"/>
    <path d="M529 137h6l2-3h9l2 3h7v17h-26zm13 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4" fill="#2B4FA3"/>
    <text x="542" y="183" font-size="14" font-weight="bold" fill="#1A1C1E">Servicios</text>
    <text x="542" y="204" font-size="11" fill="#5F6368">Trabajos, tarifas</text>
    <text x="542" y="220" font-size="11" fill="#5F6368">e insumos utilizados</text>

    <rect x="655" y="108" width="194" height="132" rx="14" fill="#FFFFFF" stroke="#CFD7E3" stroke-width="1.5"/>
    <circle cx="752" cy="144" r="22" fill="#E6EDFA"/>
    <path d="M752 130a14 14 0 1 0 14 14h-3a11 11 0 1 1-11-11v-3zm-1 5v10l7 4 1.5-2.5-5.5-3.2V135z" fill="#2B4FA3"/>
    <text x="752" y="183" font-size="14" font-weight="bold" fill="#1A1C1E">Registros</text>
    <text x="752" y="204" font-size="11" fill="#5F6368">Ventas, clientes,</text>
    <text x="752" y="220" font-size="11" fill="#5F6368">caja y turnos</text>
  </g>

  <rect x="28" y="254" width="824" height="36" rx="12" fill="#E2F2F6"/>
  <text x="440" y="277" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2F6F80" text-anchor="middle">Ajustes no ocupa un destino inferior: se abre con el engranaje de Inicio y se regresa con Atrás</text>

  <rect x="24" y="305" width="832" height="136" rx="14" fill="#FFFFFF" stroke="#CFD7E3" stroke-width="1.6"/>
  <text x="440" y="329" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1C1E" text-anchor="middle">ACCIONES CON ICONOS Y DESCRIPCIONES ACCESIBLES</text>

  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <circle cx="105" cy="363" r="18" fill="#E6EDFA"/><text x="105" y="369" font-size="19" font-weight="bold" fill="#2B4FA3">?</text>
    <text x="105" y="398" font-size="11" font-weight="bold" fill="#1A1C1E">Ayuda</text>
    <text x="105" y="416" font-size="10" fill="#5F6368">Arriba a la izquierda</text>

    <circle cx="239" cy="363" r="18" fill="#E6EDFA"/><path d="M239 351a2 2 0 0 1 2 2v2a9 9 0 0 1 5 3l2-1 2 4-2 2a9 9 0 0 1 0 4l2 2-2 4-3-1a9 9 0 0 1-4 2v3h-5v-3a9 9 0 0 1-4-2l-3 1-2-4 2-2a9 9 0 0 1 0-4l-2-2 2-4 3 1a9 9 0 0 1 4-3v-2a2 2 0 0 1 2-2zm0 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8" fill="#2B4FA3"/>
    <text x="239" y="398" font-size="11" font-weight="bold" fill="#1A1C1E">Ajustes</text>
    <text x="239" y="416" font-size="10" fill="#5F6368">Engranaje en Inicio</text>

    <circle cx="373" cy="363" r="18" fill="#2B4FA3"/><path d="M362 355h3l2 2h9l2-2h4l-1 4 4 4v2h-2a4 4 0 0 1-8 0h-5a4 4 0 0 1-8 0h-2v-2l3-3zm4 11a2 2 0 1 0 0 4 2 2 0 0 0 0-4m13 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4" fill="#FFFFFF"/>
    <text x="373" y="398" font-size="11" font-weight="bold" fill="#1A1C1E">Vender</text>
    <text x="373" y="416" font-size="10" fill="#5F6368">Debajo del banner</text>

    <circle cx="507" cy="363" r="18" fill="#2B4FA3"/><path d="M497 357h20v14h-20zm3 3v2h4v-2zm7 0v2h7v-2zm-7 5v2h4v-2zm7 0v2h7v-2z" fill="#FFFFFF"/>
    <text x="507" y="398" font-size="11" font-weight="bold" fill="#1A1C1E">Caja</text>
    <text x="507" y="416" font-size="10" fill="#5F6368">Debajo del banner</text>

    <circle cx="641" cy="363" r="18" fill="#E6EDFA"/><path d="M632 352h18v2h-18zm2 4h14l-2 5v6l-5 4v-10z" fill="#2B4FA3"/>
    <text x="641" y="398" font-size="11" font-weight="bold" fill="#1A1C1E">Filtrar</text>
    <text x="641" y="416" font-size="10" fill="#5F6368">Embudo</text>

    <circle cx="775" cy="363" r="18" fill="#E6EDFA"/><path d="M774 350h3v10l4-4 2 2-8 8-8-8 2-2 5 4zm-9 16h21v6h-21z" fill="#2B4FA3"/>
    <text x="775" y="398" font-size="11" font-weight="bold" fill="#1A1C1E">Exportar</text>
    <text x="775" y="416" font-size="10" fill="#5F6368">Informes y listas</text>
  </g>

  <text x="440" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#5F6368" text-anchor="middle">En ventanas emergentes se conserva el texto de Confirmar, Eliminar, Omitir y Cancelar.</text>
</svg>
