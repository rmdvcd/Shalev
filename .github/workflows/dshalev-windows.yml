name: DShalev Windows portable

on:
  push:
    paths:
      - 'Web-Desktop/**'
      - '.github/workflows/dshalev-windows.yml'
  pull_request:
    paths:
      - 'Web-Desktop/**'
      - '.github/workflows/dshalev-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias y probar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Web-Desktop/requirements-dev.txt
          python -m pytest Web-Desktop/tests -q
      - name: Accesibilidad de las plantillas (ramplint)
        shell: pwsh
        run: ramplint --no-django Web-Desktop/dshalev/templates
      - name: Probar interacción del punto de venta
        working-directory: Web-Desktop
        run: |
          npm ci
          npm test
      - name: Crear ejecutable portable
        shell: pwsh
        working-directory: Web-Desktop
        run: .\build_windows.ps1
      - name: Probar el ejecutable portable
        shell: pwsh
        working-directory: Web-Desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path .\dist\DShalev.exe).Path
          $proceso = Start-Process -FilePath $exe -ArgumentList '--no-browser', '--port', '47999' -PassThru
          try {
            $listo = $false
            for ($intento = 0; $intento -lt 120; $intento++) {
              Start-Sleep -Milliseconds 500
              try {
                $salud = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:47999/healthz' -TimeoutSec 2
                if ($salud.StatusCode -eq 200) { $listo = $true; break }
              } catch { }
            }
            if (-not $listo) { throw 'El ejecutable no respondió en /healthz en 60 s.' }
            $inicio = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:47999/configurar' -TimeoutSec 5
            if ($inicio.StatusCode -ne 200 -or $inicio.Content -notmatch 'DShalev') {
              throw 'El ejecutable no sirvió la configuración inicial.'
            }
            Write-Host 'El ejecutable portable arranca y sirve la interfaz.' -ForegroundColor Green
          } finally {
            taskkill /PID $proceso.Id /T /F | Out-Null
          }
      - name: Publicar DShalev.exe
        uses: actions/upload-artifact@v4
        with:
          name: DShalev-Windows-x64
          path: Web-Desktop/dist/DShalev.exe
          if-no-files-found: error
          retention-days: 14
