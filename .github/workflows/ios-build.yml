name: Compilación iOS de IShalev

on:
  push:
    paths:
      - 'IShalev/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'IShalev/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Compilar app para iOS Simulator e IPA
    # macos-15-intel evita la saturación de cola de los runners arm64 estándar de GitHub
    # y conserva Xcode 16.4; ARCHS="arm64 x86_64" genera binario universal de simulador para Appetize.
    runs-on: macos-15-intel
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Mostrar herramientas de Apple
        run: |
          xcodebuild -version
          swift --version

      - name: Ejecutar pruebas unitarias del dominio iOS
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path IShalev 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Compilar sin firma para el simulador (universal arm64 + x86_64)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project IShalev/IShalev.xcodeproj \
            -scheme IShalev \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/IShalevDerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          archs=$(lipo -archs "$RUNNER_TEMP/IShalevDerivedData/Build/Products/Debug-iphonesimulator/IShalev.app/IShalev")
          echo "::notice::Arquitecturas simulador IShalev.app: $archs"

      - name: Detectar configuración de firma Apple
        id: signing-config
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$IOS_CERTIFICATE_BASE64" && -n "$IOS_CERTIFICATE_PASSWORD" && \
                -n "$IOS_PROVISIONING_PROFILE_BASE64" && -n "$IOS_TEAM_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Hay credenciales Apple; se generará una IPA firmada."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            message="Faltan secretos de firma Apple; se generará una IPA sin firma, no instalable en dispositivos."
            echo "$message" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::$message"
          fi

      - name: Firmar y exportar IShalev.ipa
        if: steps.signing-config.outputs.configured == 'true'
        id: sign-ipa
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          BUNDLE_ID="cu.shalev.ishalev"
          EXPORT_METHOD="${IOS_EXPORT_METHOD:-app-store-connect}"
          case "$EXPORT_METHOD" in
            app-store-connect|ad-hoc|development|enterprise) ;;
            *) echo "::error::IOS_EXPORT_METHOD no válido: $EXPORT_METHOD"; exit 1 ;;
          esac
          SIGNING_IDENTITY="${IOS_SIGNING_IDENTITY:-}"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            if [[ "$EXPORT_METHOD" == "development" ]]; then
              SIGNING_IDENTITY="Apple Development"
            else
              SIGNING_IDENTITY="Apple Distribution"
            fi
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/ishalev-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/ishalev-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/ishalev-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ishalev-profile.plist"
          ARCHIVE_PATH="$RUNNER_TEMP/IShalev.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/IShalevExport"
          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"
          if [[ "$PROFILE_TEAM" != "$IOS_TEAM_ID" ]]; then
            echo "::error::El Team ID del perfil no coincide con IOS_TEAM_ID."; exit 1
          fi
          case "$BUNDLE_ID" in
            $PROFILE_BUNDLE_ID) ;;
            *) echo "::error::El perfil no autoriza el bundle ID $BUNDLE_ID."; exit 1 ;;
          esac
          if [[ ! "$PROFILE_UUID" =~ ^[A-Fa-f0-9-]+$ ]]; then
            echo "::error::UUID no válido en el provisioning profile."; exit 1
          fi
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db" /Library/Keychains/System.keychain
          mkdir -p "$PROFILE_INSTALL_DIR"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"

          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          set -o pipefail
          xcodebuild \
            -project IShalev/IShalev.xcodeproj \
            -scheme IShalev \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild-signed-archive.log"

          EXPORT_METHOD="$EXPORT_METHOD" SIGNING_IDENTITY="$SIGNING_IDENTITY" \
          PROFILE_NAME="$PROFILE_NAME" IOS_TEAM_ID="$IOS_TEAM_ID" BUNDLE_ID="$BUNDLE_ID" \
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["IOS_TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": os.environ["SIGNING_IDENTITY"],
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "stripSwiftSymbols": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "IShalev-ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/IShalev-ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-export.log"

          IPA_PATH="$EXPORT_PATH/IShalev.ipa"
          test -f "$IPA_PATH"
          VERIFY_DIR="$RUNNER_TEMP/IShalev-ipa-verify"
          rm -rf "$VERIFY_DIR" "$RUNNER_TEMP/IShalev.ipa"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA_PATH" "$VERIFY_DIR"
          APP_PATH="$VERIFY_DIR/Payload/IShalev.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNED_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [[ "$SIGNED_BUNDLE_ID" != "$BUNDLE_ID" ]]; then
            echo "::error::Bundle ID inesperado en la IPA firmada: $SIGNED_BUNDLE_ID"; exit 1
          fi
          ditto "$IPA_PATH" "$RUNNER_TEMP/IShalev.ipa"
          ipa_size=$(du -h "$RUNNER_TEMP/IShalev.ipa" | cut -f1)
          message="IPA firmada y verificada con $SIGNING_IDENTITY ($EXPORT_METHOD), bundle $BUNDLE_ID ($ipa_size)."
          echo "$message" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::$message"

      - name: Compilar sin firma para dispositivo iOS y empaquetar IShalev.ipa
        if: steps.signing-config.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project IShalev/IShalev.xcodeproj \
            -scheme IShalev \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/IShalevDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-device.log"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/IShalev.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$RUNNER_TEMP/IShalevDeviceDerivedData/Build/Products/Release-iphoneos/IShalev.app" \
            "$RUNNER_TEMP/Payload/IShalev.app"
          (cd "$RUNNER_TEMP" && zip -r -y -q IShalev.ipa Payload)
          ipa_size=$(du -h "$RUNNER_TEMP/IShalev.ipa" | cut -f1)
          echo "::notice::IShalev.ipa sin firma generado ($ipa_size)"

      - name: Limpiar credenciales de firma Apple
        if: always() && steps.signing-config.outputs.configured == 'true'
        shell: bash
        env:
          PROFILE_UUID: ${{ steps.sign-ipa.outputs.profile_uuid }}
        run: |
          security delete-keychain "$RUNNER_TEMP/ishalev-signing.keychain-db" 2>/dev/null || true
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/ishalev-signing.p12" \
            "$RUNNER_TEMP/ishalev-profile.mobileprovision" \
            "$RUNNER_TEMP/ishalev-profile.plist"

      - name: Resumir errores de compilación Swift
        if: failure()
        shell: bash
        run: |
          for log in "$RUNNER_TEMP/swift-test.log" "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/xcodebuild-device.log" "$RUNNER_TEMP/xcodebuild-signed-archive.log" "$RUNNER_TEMP/xcodebuild-export.log"; do
            if [ -f "$log" ]; then
              swift_errors=$(grep -E '\.swift:[0-9]+:[0-9]+: error:' "$log" | head -n 10 || true)
              if [ -n "$swift_errors" ]; then
                while IFS= read -r issue; do echo "::error::$issue"; done <<< "$swift_errors"
              fi
            fi
          done

      - name: Resumir otros errores de compilación y pruebas
        if: failure()
        shell: bash
        run: |
          for log in "$RUNNER_TEMP/swift-test.log" "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/xcodebuild-device.log" "$RUNNER_TEMP/xcodebuild-signed-archive.log" "$RUNNER_TEMP/xcodebuild-export.log"; do
            if [ -f "$log" ]; then
              issues=$(grep -E 'error:|BUILD FAILED|Test Suite .* failed|The following build commands failed' "$log" | tail -n 100 || true)
              if [ -n "$issues" ]; then
                {
                  echo "## Diagnóstico de $(basename "$log")"
                  echo '```text'
                  printf '%s\n' "$issues"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                while IFS= read -r issue; do echo "::error::$issue"; done <<< "$(printf '%s\n' "$issues" | head -n 9)"
              fi
            fi
          done

      - name: Empaquetar app de simulador para Appetize
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/IShalevDerivedData/Build/Products/Debug-iphonesimulator/IShalev.app"
          "$RUNNER_TEMP/IShalev-iOS-Simulator.zip"

      - name: Subir la app a Appetize (opcional)
        if: github.event_name != 'pull_request'
        env:
          APPETIZE_API_KEY: ${{ secrets.APPETIZE_API_KEY }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_KEY" ]; then
            message="APPETIZE_API_KEY no está configurado; el ZIP se publica como artefacto para subirlo manualmente."
            echo "$message" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice::$message"
            exit 0
          fi
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            endpoint="https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY"
          else
            endpoint="https://api.appetize.io/v1/apps"
          fi
          response=$(curl --fail --silent --show-error -X POST "$endpoint" \
            -H "X-API-KEY: $APPETIZE_API_KEY" \
            -F "file=@$RUNNER_TEMP/IShalev-iOS-Simulator.zip" \
            -F "platform=ios")
          app_url=$(echo "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); key=data.get("publicKey") or data.get("buildId"); print("https://appetize.io/app/" + key if key else "")')
          if [ -z "$app_url" ]; then
            echo "::warning::Appetize respondió sin publicKey/buildId; revisa el resultado de subida."
          else
            message="Appetize build: $app_url"
            echo "$message" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice::$message"
          fi

      - name: Publicar el artefacto de simulador
        uses: actions/upload-artifact@v4
        with:
          name: IShalev-iOS-Simulator
          path: ${{ runner.temp }}/IShalev-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publicar IShalev.ipa (firmada si hay credenciales Apple)
        uses: actions/upload-artifact@v4
        with:
          name: IShalev-iOS-IPA
          path: ${{ runner.temp }}/IShalev.ipa
          if-no-files-found: error
          retention-days: 7
