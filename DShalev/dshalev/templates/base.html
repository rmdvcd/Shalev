<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fa"><title>{% block title %}DShalev{% endblock %} · Shalev</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">S</span><span>DShalev<small>Escritorio</small></span></a>
  <div class="top-actions"><span class="business-name">{{ business_name }}</span><span class="user-chip">{{ user.username }}</span><form action="/salir" method="post" class="inline-form"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="quiet-button" type="submit">Salir</button></form></div>
</header>
<aside class="rail">
  <a href="/" class="nav-link {% if section == 'inicio' %}active{% endif %}"><span>⌂</span>Inicio</a>
  <a href="/inventario" class="nav-link {% if section == 'inventario' %}active{% endif %}"><span>▦</span>Inventario</a>
  <a href="/ventas" class="nav-link {% if section == 'ventas' %}active{% endif %}"><span>＋</span>Ventas</a>
  <a href="/equipo" class="nav-link {% if section == 'equipo' %}active{% endif %}"><span>♙</span>Equipo</a>
  <a href="/red" class="nav-link {% if section == 'red' %}active{% endif %}"><span>⌁</span>Acceso</a>
  <div class="rail-footer">DShalev · 0.1</div>
</aside>
<main class="main-shell">
  {% if notice %}<div class="notice {{ notice_kind or 'info' }}" role="status">{{ notice }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
{% else %}{% block public_content %}{% endblock %}{% endif %}
</body></html>
