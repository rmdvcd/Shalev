{% extends 'base.html' %}
{% block title %}Editar artículo{% endblock %}
{% block content %}
<div class="page-heading">
  <div><p class="eyebrow">CATÁLOGO DEL NEGOCIO</p><h1>Editar artículo</h1><p class="muted">Actualiza el nombre, precio, tipo o existencias.</p></div>
  <a class="secondary-button" href="/inventario">Volver</a>
</div>
<section class="panel">
  <form method="post" action="/inventario/{{ item.id }}/editar" class="form-stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Nombre<input name="name" required minlength="3" maxlength="80" value="{{ item.name }}"><small class="tiny">De 3 a 80 caracteres.</small></label>
    <div class="form-row">
      <label>Tipo<select name="category"><option {% if item.category == 'Producto' %}selected{% endif %}>Producto</option><option {% if item.category == 'Insumo' %}selected{% endif %}>Insumo</option><option {% if item.category == 'Servicio' %}selected{% endif %}>Servicio</option></select></label>
      <label>Unidad<input name="unit" required maxlength="20" value="{{ item.unit }}"></label>
    </div>
    <div class="form-row">
      <label>Precio de venta (CUP)<input name="sale_price" type="number" min="0" step="0.01" value="{{ '%.2f'|format(item.sale_price_cents / 100) }}" required></label>
      <label>Costo (CUP)<input name="cost" type="number" min="0" step="0.01" value="{{ '%.2f'|format(item.cost_cents / 100) }}" required></label>
    </div>
    <div class="form-row">
      <label>Existencia<input name="stock" type="number" min="0" step="0.001" value="{{ item.stock|qty }}" required></label>
      <label>Stock bajo<input name="low_stock" type="number" min="0" step="0.001" value="{{ item.low_stock|qty }}" required></label>
    </div>
    <label>Stock crítico<input name="critical_stock" type="number" min="0" step="0.001" value="{{ item.critical_stock|qty }}" required></label>
    <label>Motivo del ajuste de existencia<input name="reason" maxlength="160" placeholder="Obligatorio si cambias la existencia"><small class="tiny">De 3 a 160 caracteres. Los cambios de nombre o precio no requieren motivo.</small></label>
    <button class="primary-button" type="submit">Guardar cambios</button>
  </form>
</section>
{% endblock %}
